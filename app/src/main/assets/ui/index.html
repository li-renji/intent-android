<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>起点OS mini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- 左侧导航栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="avatar" id="user-avatar" title="菜单">起</div>
                <button class="add-btn" id="add-btn" title="新建">+</button>
            </div>
            <!-- 头像弹出菜单 -->
            <div class="avatar-menu" id="avatar-menu" style="display:none;">
                <div class="avatar-menu-item" data-action="settings">⚙️ 设置</div>
                <div class="avatar-menu-item" data-action="about">ℹ️ 关于</div>
            </div>
            <div class="search-box" id="browser-entry" title="搜索/浏览器">
                <span class="search-icon">🔍</span>
                <span class="search-placeholder">搜索</span>
            </div>
            <nav class="nav-menu">
                <div class="nav-item active" data-page="messages">
                    <span class="nav-icon">💬</span>
                    <span class="nav-text">消息</span>
                    <span class="badge" id="msg-badge" style="display:none;">0</span>
                </div>
                <div class="nav-item" data-page="contacts">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">通讯录</span>
                </div>
                <div class="nav-item" data-page="knowledge">
                    <span class="nav-icon">📚</span>
                    <span class="nav-text">知识库</span>
                </div>
                <div class="nav-item" data-page="apps">
                    <span class="nav-icon">📦</span>
                    <span class="nav-text">应用</span>
                </div>
            </nav>
        </div>

        <!-- 中间列表栏 -->
        <div class="list-panel">
            <div class="list-header">
                <button id="qd-menu-btn" class="qd-menu-btn" title="菜单">☰</button>
                <h2 id="list-title">消息</h2>
            </div>
            <div class="list-content" id="list-content"></div>
        </div>

        <!-- 右侧内容区 -->
        <div class="content-panel">
            <div class="content-header" id="content-header">
                <button id="qd-back" class="qd-back-btn" title="返回">‹</button>
                <span>起点OS mini</span>
            </div>
            <div class="content-body" id="content-body">
                <div class="empty-state">
                    <div class="empty-icon">🚀</div>
                    <p>选择左侧列表开始</p>
                </div>
            </div>
            <div class="content-footer" id="content-footer" style="display:none;">
                <input type="text" id="message-input" placeholder="输入消息..." autocomplete="off">
                <button id="send-btn">发送</button>
            </div>
        </div>
    </div>
    <!-- 全局实时状态灯：绿=AI 就绪，黄=加载中，红=异常。点按显示详情。
         数据由 app.js 的 QdStatus 每 2 秒刷新。
         不用 fixed 定位（部分双屏/刘海设备布局视口与可见区对不齐，会跑出屏幕），
         由 app.js 的 placeDot() 自动挂到当前顶栏右侧。 -->
    <div id="qd-status-dot" class="qd-status-dot" title="系统状态"></div>
    <!-- 竖屏导航抽屉遮罩：点按关闭抽屉 -->
    <div class="qd-drawer-mask" id="qd-drawer-mask"></div>
    <script src="app.js"></script>
</body>
</html>
